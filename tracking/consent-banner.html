<!--
  GDPR cookie-consent баннер (Ирландия / ePrivacy + GDPR).
  Вставить в <head> ПОСЛЕ head-snippet.html.
  Работает с Consent Mode v2 из head-snippet.html: до нажатия «Accept»
  analytics_storage и ad_storage = denied.

  Самописный и минимальный — без внешних сервисов, без платы.
  Если позже понадобится сертифицированный CMP — бесплатные варианты:
  Cookiebot (до 1 домена / 50 подстраниц) или CookieYes free.
-->
<style>
  #ef-consent{position:fixed;left:0;right:0;bottom:0;z-index:2147483000;
    background:#111;color:#f5f5f5;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:16px 20px;display:none;box-shadow:0 -4px 24px rgba(0,0,0,.35)}
  #ef-consent[data-show="1"]{display:block}
  #ef-consent .ef-wrap{max-width:1100px;margin:0 auto;display:flex;gap:16px;
    align-items:center;flex-wrap:wrap;justify-content:space-between}
  #ef-consent p{margin:0;flex:1 1 380px;min-width:260px}
  #ef-consent a{color:#f5b73f;text-decoration:underline}
  #ef-consent .ef-btns{display:flex;gap:10px;flex:0 0 auto}
  #ef-consent button{cursor:pointer;border:0;border-radius:8px;padding:10px 18px;
    font:600 14px/1 system-ui,sans-serif}
  #ef-accept{background:#f5b73f;color:#111}
  #ef-reject{background:transparent;color:#f5f5f5;border:1px solid #555}
  @media(max-width:560px){#ef-consent .ef-btns{width:100%}#ef-consent button{flex:1}}
</style>

<div id="ef-consent" role="dialog" aria-live="polite" aria-label="Cookie consent">
  <div class="ef-wrap">
    <p>We use cookies to measure website traffic and improve our service. You can accept
       analytics cookies or continue with essential cookies only.
       See our <a href="/privacy-policy">Privacy Policy</a>.</p>
    <div class="ef-btns">
      <button id="ef-reject" type="button">Essential only</button>
      <button id="ef-accept" type="button">Accept all</button>
    </div>
  </div>
</div>

<script>
(function(){
  function ready(fn){ if(document.readyState!=='loading') fn();
    else document.addEventListener('DOMContentLoaded', fn); }
  ready(function(){
    var el = document.getElementById('ef-consent');
    if(!el) return;
    var saved = null;
    try { saved = localStorage.getItem('ef_consent'); } catch(e) {}
    if(!saved) el.setAttribute('data-show','1');

    function set(state){
      try { localStorage.setItem('ef_consent', state); } catch(e) {}
      if (window.gtag) {
        var g = state === 'granted' ? 'granted' : 'denied';
        gtag('consent','update',{
          ad_storage:g, ad_user_data:g, ad_personalization:g, analytics_storage:g
        });
      }
      el.removeAttribute('data-show');
    }
    document.getElementById('ef-accept').addEventListener('click', function(){ set('granted'); });
    document.getElementById('ef-reject').addEventListener('click', function(){ set('denied'); });
  });
})();
</script>
