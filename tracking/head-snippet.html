<!--
  Expert Fix Services — единый сниппет аналитики
  Вставить в <head> сайта (Hostinger Horizons → Settings → Custom code → Head).

  ПЕРЕД ВСТАВКОЙ заменить 4 значения:
    G-XXXXXXXXXX   → GA4 Measurement ID
    GTM-XXXXXXX    → GTM Container ID
    000000000000000 → Meta Pixel ID
    CLARITYID      → Clarity Project ID
    GSC_TOKEN      → значение content из HTML-tag верификации Search Console

  Что делает:
    - Consent Mode v2: до согласия аналитика в denied (GDPR-совместимо)
    - GA4 + GTM + Meta Pixel + Clarity
    - SPA-роутинг: отправляет page_view при смене URL (сайт на React, обычной перезагрузки нет)
    - авто-события: whatsapp_click, phone_call, email_click, generate_lead
-->

<!-- Google Search Console verification -->
<meta name="google-site-verification" content="GSC_TOKEN" />

<!-- Consent Mode v2 — ДОЛЖЕН идти первым, до любых тегов -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  var efConsent = null;
  try { efConsent = localStorage.getItem('ef_consent'); } catch(e) {}
  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied',
    functionality_storage: 'granted',
    security_storage: 'granted',
    wait_for_update: 500
  });
  if (efConsent === 'granted') {
    gtag('consent', 'update', {
      ad_storage: 'granted', ad_user_data: 'granted',
      ad_personalization: 'granted', analytics_storage: 'granted'
    });
  }
</script>

<!-- Expert Fix: SPA page_view + авто-события конверсий -->
<script>
(function () {
  var GA4_ID = 'G-XXXXXXXXXX';

  function track(name, params) {
    params = params || {};
    if (window.gtag) gtag('event', name, params);
    window.dataLayer.push(Object.assign({ event: name }, params));
  }

  // --- page_view при смене маршрута в SPA ---
  var lastPath = location.pathname + location.search;
  function sendPageView() {
    var path = location.pathname + location.search;
    if (path === lastPath) return;
    lastPath = path;
    if (window.gtag) {
      gtag('event', 'page_view', {
        page_location: location.href,
        page_path: path,
        page_title: document.title
      });
    }
    if (window.fbq) fbq('track', 'PageView');
  }
  ['pushState', 'replaceState'].forEach(function (m) {
    var orig = history[m];
    history[m] = function () {
      var r = orig.apply(this, arguments);
      setTimeout(sendPageView, 50);
      return r;
    };
  });
  window.addEventListener('popstate', function () { setTimeout(sendPageView, 50); });

  // --- клики по контактам (делегирование: работает и для элементов, которых ещё нет) ---
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href') || '';

    if (/wa\.me|api\.whatsapp\.com|web\.whatsapp\.com/i.test(href)) {
      track('whatsapp_click', { link_url: href, page_path: location.pathname });
      if (window.fbq) fbq('track', 'Contact', { method: 'whatsapp' });
    } else if (/^tel:/i.test(href)) {
      track('phone_call', { phone: href.replace(/^tel:/i, ''), page_path: location.pathname });
      if (window.fbq) fbq('track', 'Contact', { method: 'phone' });
    } else if (/^mailto:/i.test(href)) {
      track('email_click', { email: href.replace(/^mailto:/i, ''), page_path: location.pathname });
      if (window.fbq) fbq('track', 'Contact', { method: 'email' });
    }
  }, true);

  // --- отправка формы заявки = основная конверсия ---
  document.addEventListener('submit', function (e) {
    var form = e.target;
    if (!form || form.tagName !== 'FORM') return;
    var service = '';
    var sel = form.querySelector('select');
    if (sel) service = sel.value || '';
    track('generate_lead', {
      form_id: form.id || 'quote_form',
      service_type: service,
      page_path: location.pathname,
      value: 1,
      currency: 'EUR'
    });
    if (window.fbq) fbq('track', 'Lead', { content_name: service || 'quote_form' });
  }, true);

  // --- страховка: если форма отправляется через JS без submit-события,
  //     ловим клик по кнопке отправки ---
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button');
    if (!b) return;
    var t = (b.textContent || '').trim().toLowerCase();
    if (t === 'send message' || t === 'submit' || t.indexOf('send') === 0) {
      var form = b.closest('form');
      if (form) return; // уже поймает submit-хендлер выше
      track('generate_lead', { form_id: 'quote_form_click', page_path: location.pathname, value: 1, currency: 'EUR' });
      if (window.fbq) fbq('track', 'Lead');
    }
  }, true);
})();
</script>
